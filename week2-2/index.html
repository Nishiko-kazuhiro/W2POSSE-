  <main class="main">

      <h1 class="main-title">Flexboxヘッダー練習</h1>
      <p class="description">
        このページではFlexboxを使ったヘッダーレイアウトを練習します。<br>
        上部のヘッダーがFlexboxで作られています。
      </p>
      
      <div class="practice-section">
        <h2 class="section-title">練習問題</h2>
        <p class="question">
          現在のヘッダーは要素が縦に並んでいます。<br>
          CSSを修正して、ロゴとナビゲーションを横並びにしてください。
        </p>
        
        <div class="hint-box">
          <h3 class="hint-title">ヒント</h3>
          <ul class="hint-list">
            <li>ヘッダーコンテナに <code>display: flex</code> を適用する</li>
            <li>ロゴとナビゲーションの間隔を調整するために <code>justify-content</code> を使う</li>
            <li>ナビゲーションリストにも <code>display: flex</code> を適用する</li>
          </ul>
        </div>
      </div>
    </div>
