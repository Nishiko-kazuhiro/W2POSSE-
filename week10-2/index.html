<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week10 ミニドリル 問題2｜ユーザー表示（バグあり）</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-8">

  <div class="w-full max-w-sm rounded-xl border border-slate-200 bg-white p-8 shadow-sm">
    <h1 class="text-xl font-bold text-slate-900">ユーザー情報</h1>
    <p class="mt-1 mb-6 text-sm text-slate-500">読み込んでも名前が表示されず、Console にエラーが出る…</p>

    <dl class="space-y-2 text-sm">
      <div class="flex justify-between">
        <dt class="text-slate-500">名前</dt>
        <dd id="userName" class="font-medium text-slate-900">読み込み中...</dd>
      </div>
      <div class="flex justify-between">
        <dt class="text-slate-500">メール</dt>
        <dd id="userEmail" class="font-medium text-slate-900">-</dd>
      </div>
    </dl>
  </div>

  <script>
    async function loadUser() {
      // ここにバグがあります（Console のエラーを読みながら直してください）
      const response = fetch("https://jsonplaceholder.typicode.com/users/1");
      const data = await response.json();

      document.getElementById("userName").textContent = data.name;
      document.getElementById("userEmail").textContent = data.email;
    }

    loadUser();
  </script>
</body>
</html>
