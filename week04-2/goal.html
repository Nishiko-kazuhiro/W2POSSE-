<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week04-2 hover バグ修正 ゴールUI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">

  <h1 class="text-2xl font-bold text-gray-700 mb-2">Week04-2: hover の正しい書き方</h1>
  <p class="text-gray-500 mb-8">ボタンやカードにマウスを乗せると変化することを確認してください。</p>

  <div class="flex gap-6 flex-wrap mb-10">

    <!-- 正しい hover ボタン -->
    <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition">
      ✅ ボタン（hover 正常）
    </button>

    <button class="bg-gray-200 hover:bg-gray-400 text-gray-800 font-bold py-3 px-6 rounded-lg transition">
      ✅ グレーボタン（hover 正常）
    </button>

  </div>

  <div class="grid grid-cols-1 gap-4 max-w-lg">

    <div class="bg-white rounded-xl p-6 shadow hover:shadow-lg transition cursor-pointer">
      <h2 class="font-bold text-gray-800 mb-1">✅ カード A</h2>
      <p class="text-gray-500 text-sm">マウスを乗せると影が強くなります。</p>
    </div>

    <div class="bg-white rounded-xl p-6 shadow hover:shadow-lg transition cursor-pointer">
      <h2 class="font-bold text-gray-800 mb-1">✅ カード B</h2>
      <p class="text-gray-500 text-sm">hover:shadow-lg が正しく書かれています。</p>
    </div>

  </div>

  <!-- 解説 -->
  <div class="mt-10 bg-green-50 border border-green-200 rounded-xl p-6 max-w-lg">
    <h3 class="font-bold text-green-800 mb-2">💡 ポイント</h3>
    <p class="text-green-700 text-sm">
      Tailwind の擬似クラスは <code class="bg-green-100 px-1 rounded">hover:bg-blue-700</code> のように<br>
      <strong>コロンの直後にスペースを入れない</strong>のが正しい書き方です。
    </p>
  </div>

</body>
</html>
