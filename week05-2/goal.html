<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week05-2 md: バグ修正 ゴールUI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">

  <h1 class="text-2xl font-bold text-gray-700 mb-2">Week05-2: md: クラスの正しい書き方</h1>
  <p class="text-gray-500 mb-8">画面幅を広げると2列になることを確認してください（768px以上）。</p>

  <!-- 正しい: md:grid-cols-2 (スペースなし) -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-2xl">

    <div class="bg-blue-100 rounded-xl p-6 shadow">
      <h2 class="font-bold text-blue-800 mb-1">✅ カード 1</h2>
      <p class="text-blue-700 text-sm">md:grid-cols-2 が正しく動いています。</p>
    </div>

    <div class="bg-green-100 rounded-xl p-6 shadow">
      <h2 class="font-bold text-green-800 mb-1">✅ カード 2</h2>
      <p class="text-green-700 text-sm">画面を広げると横並びになります。</p>
    </div>

    <div class="bg-yellow-100 rounded-xl p-6 shadow">
      <h2 class="font-bold text-yellow-800 mb-1">✅ カード 3</h2>
      <p class="text-yellow-700 text-sm">レスポンシブが機能しています。</p>
    </div>

    <div class="bg-purple-100 rounded-xl p-6 shadow">
      <h2 class="font-bold text-purple-800 mb-1">✅ カード 4</h2>
      <p class="text-purple-700 text-sm">正しいクラス名を使っています。</p>
    </div>

  </div>

  <div class="mt-8 bg-green-50 border border-green-200 rounded-xl p-6 max-w-2xl">
    <h3 class="font-bold text-green-800 mb-2">💡 ポイント</h3>
    <p class="text-green-700 text-sm">
      レスポンシブプレフィックスは <code class="bg-green-100 px-1 rounded">md:grid-cols-2</code> のように<br>
      <strong>コロンの直後にスペースを入れない</strong>のが正しい書き方です。<br>
      <code class="bg-red-100 px-1 rounded">md: grid-cols-2</code>（スペースあり）はTailwindに認識されません。
    </p>
  </div>

</body>
</html>
