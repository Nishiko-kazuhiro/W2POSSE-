<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week12 ミニドリル 問題2｜スライダー（バグあり）</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 p-8">

  <div class="mx-auto max-w-2xl">
    <header class="mb-6">
      <h1 class="text-2xl font-bold text-slate-900">作品スライダー</h1>
      <p class="mt-1 text-sm text-slate-600">スライダーが表示されず、矢印も出ない…クラス名を見直してください</p>
    </header>

    <section class="splide" aria-label="作品スライダー">
      <div class="splide__track">
        <ul class="splide-list">
          <li class="splide__slide">
            <div class="flex h-48 items-center justify-center rounded-lg bg-indigo-500 text-2xl font-bold text-white">作品1</div>
          </li>
          <li class="splide__slide">
            <div class="flex h-48 items-center justify-center rounded-lg bg-emerald-500 text-2xl font-bold text-white">作品2</div>
          </li>
          <li class="splide__slide">
            <div class="flex h-48 items-center justify-center rounded-lg bg-rose-500 text-2xl font-bold text-white">作品3</div>
          </li>
        </ul>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
  <script>
    new Splide('.splide').mount();
  </script>
</body>
</html>
