<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自己紹介ページ</title>
</head>
<body>
  <!-- 
    このファイルに、README.mdの指示に従ってHTMLタグを追加してください
    
    練習問題1: 見出しタグの作成
    - h1タグを使って、ページのメインタイトルを作成してください（例: "あなたの名前の自己紹介"）
    - h2タグを使って、「基本情報」「趣味」「好きなサイト」「プロフィール画像」「連絡先」の5つのセクションタイトルを作成してください
  -->
  
  
  <!-- 
    練習問題2: 段落タグで自己紹介文の作成
    - 「基本情報」セクションに、pタグを使って自己紹介文を2つの段落で書いてください
    - 「趣味」セクションに、pタグを使って趣味について2つの段落で書いてください
  -->
  
  
  <!-- 
    練習問題3: リンクタグの作成
    - 「好きなサイト」セクションに、pタグとaタグを使って外部サイトへのリンクを2つ作成してください
    - 例: <p>よく利用するサイトは<a href="https://www.google.com">Google</a>です。</p>
    - ヒント: href属性にURLを指定します
  -->
  
  
  <!-- 
    練習問題4: 画像タグの作成
    - 「プロフィール画像」セクションに、imgタグを使ってプロフィール画像を表示してください
    - 必要な属性: src="./img/profile.jpg", alt="あなたの名前のプロフィール画像", width="200", height="200"
    - ヒント: imgタグは終了タグが不要です
  -->
  
  
  <!-- 
    練習問題5: 連絡先情報の作成
    - 「連絡先」セクションに、pタグを使ってメールアドレスを表示してください
    - 例: <p>メール: your-email@example.com</p>
    - 余裕があれば、メールアドレスもaタグでリンクにしてみてください（href="mailto:your-email@example.com"）
  -->
  
</body>
</html>
