  <body>
    <h1>JavaScript概要 - 四則演算練習</h1>
    <p>ブラウザの開発者ツールを開いて、コンソールタブを確認してください。</p>
    <p>F12キーを押すか、右クリック→「検証」→「Console」タブを選択してください。</p>
    
    <div style="background-color: #e8f4fd; padding: 20px; margin: 20px 0; border-radius: 5px; border-left: 4px solid #2196F3;">
      <h2>四則演算とは</h2>
      <ul>
        <li><strong>足し算（+）</strong>: 数値を足し合わせる</li>
        <li><strong>引き算（-）</strong>: 数値を引く</li>
        <li><strong>掛け算（*）</strong>: 数値を掛け合わせる</li>
        <li><strong>割り算（/）</strong>: 数値を割る</li>
      </ul>
    </div>

    <div style="background-color: #fff3cd; padding: 20px; margin: 20px 0; border-radius: 5px; border-left: 4px solid #ffc107;">
      <h2>練習内容</h2>
      <ul>
        <li>JavaScriptでの四則演算の書き方を学習</li>
        <li>演算子の優先順位を理解</li>
        <li>括弧を使った計算順序の制御</li>
        <li>余り（%）演算子の使い方</li>
      </ul>
    </div>

    <script src="./js/script.js"></script>
