<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week09 ミニドリル 問題2｜ログインフォーム（バグあり）</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-8">

  <div class="w-full max-w-sm rounded-xl border border-slate-200 bg-white p-8 shadow-sm">
    <h1 class="text-xl font-bold text-slate-900">ログイン</h1>
    <p class="mt-1 mb-6 text-sm text-slate-500">ボタンを押すとメッセージが一瞬で消えてしまう…</p>

    <form id="loginForm" class="space-y-4">
      <input
        type="text"
        id="username"
        class="w-full rounded border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
        placeholder="ユーザー名"
      >
      <input
        type="password"
        id="password"
        class="w-full rounded border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
        placeholder="パスワード"
      >

      <p id="result" class="text-sm font-medium"></p>

      <button
        type="submit"
        class="w-full rounded bg-blue-600 py-2 font-bold text-white hover:bg-blue-700"
      >
        ログイン
      </button>
    </form>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const result = document.getElementById("result");

    form.addEventListener("submit", () => {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      if (username === "" || password === "") {
        result.textContent = "すべて入力してください";
        result.className = "text-sm font-medium text-red-500";
        return;
      }

      result.textContent = "ログイン成功！";
      result.className = "text-sm font-medium text-green-600";
    });
  </script>
</body>
</html>
