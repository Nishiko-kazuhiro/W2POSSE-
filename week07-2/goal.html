<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week07-2 DOMバグ診断</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #fefce8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 28px;
      max-width: 520px;
      width: 100%;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 16px;
    }
    pre {
      background: #1e293b;
      color: #f1f5f9;
      border-radius: 8px;
      padding: 16px;
      font-size: 0.8rem;
      line-height: 1.6;
      overflow-x: auto;
      margin-bottom: 20px;
      white-space: pre-wrap;
    }
    .question {
      font-size: 0.95rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 14px;
    }
    .choice {
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      font-size: 0.875rem;
      color: #475569;
      transition: border-color 0.15s, background 0.15s;
    }
    .choice:hover {
      border-color: #fbbf24;
      background: #fefce8;
    }
    .choice.selected {
      border-color: #f59e0b;
      background: #fffbeb;
      color: #92400e;
    }
    .choice-label {
      font-weight: 700;
      margin-right: 8px;
      color: #64748b;
    }
    .btn {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      background: #d97706;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { background: #b45309; }
  </style>
</head>
<body>
  <div class="card">
    <h1>DOMバグを見つけよう</h1>
    <pre>// ボタンをクリックしたら背景色を変えたい
const btn = document.getElementByID('toggle-btn');  // ← バグ
btn.addEventListener('click', function() {
  document.body.style.background = '#fef9c3';
});</pre>

    <p class="question">このコードのバグはどこですか？</p>

    <div class="choice" id="choiceA" onclick="select('A')">
      <span class="choice-label">A</span>getElementByIDのスペルが違う（正しくはgetElementById）
    </div>
    <div class="choice" id="choiceB" onclick="select('B')">
      <span class="choice-label">B</span>backgroundの書き方が間違っている
    </div>

    <button class="btn" onclick="check()">答え合わせ</button>
  </div>

  <script>
    let selected = null;
    function select(v) {
      selected = v;
      document.getElementById('choiceA').classList.toggle('selected', v === 'A');
      document.getElementById('choiceB').classList.toggle('selected', v === 'B');
    }
    function check() {
      if (!selected) { alert('選択してください'); return; }
      if (selected === 'A') {
        alert('正解！ JavaScriptのメソッド名は大文字小文字が厳密です。getElementByID ではなく getElementById（d が小文字）が正しいです。');
      } else {
        alert('不正解。backgroundの書き方は正しいです。メソッド名のスペルミスが原因です。');
      }
    }
  </script>
</body>
</html>
