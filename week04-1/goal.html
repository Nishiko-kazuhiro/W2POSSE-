<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week04-1 Goal</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen p-8">

      <h1 class="text-2xl font-bold text-gray-900 mb-6">ダッシュボード</h1>
      <div class="grid grid-cols-3 gap-4">

          <p class="text-4xl font-bold text-blue-950 mt-3">12,430</p>

        <section class="bg-green-100 rounded-xl p-6 shadow-sm">

          <p class="text-2xl font-bold text-green-950 mt-3">¥482,000</p>
        </section>
        <section class="bg-yellow-100 rounded-xl p-6 shadow-sm">
          <p class="text-sm font-bold text-yellow-700">注文</p>
          <p class="text-2xl font-bold text-yellow-950 mt-3">128件</p>
        </section>
        <section class="bg-purple-100 rounded-xl p-6 shadow-sm">
          <p class="text-sm font-bold text-purple-700">新規会員</p>
          <p class="text-2xl font-bold text-purple-950 mt-3">34名</p>
        </section>
      </div>
    </main>

</html>
