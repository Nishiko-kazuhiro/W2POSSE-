<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week04-1 ダッシュボードウィジェット ゴールUI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">

  <h1 class="text-2xl font-bold text-gray-900 mb-6">管理ダッシュボード</h1>

  <div class="grid grid-cols-3 gap-4 max-w-3xl mx-auto">

    <!-- 訪問者数（2列分） -->
    <div class="col-span-2 bg-blue-100 rounded-xl p-6">
      <h2 class="text-sm font-bold text-blue-700 mb-1">訪問者数</h2>
      <p class="text-3xl font-bold text-blue-900 mb-1">12,430</p>
      <p class="text-sm text-green-600 font-semibold">先週比 +8%</p>
    </div>

    <!-- 売上 -->
    <div class="bg-green-100 rounded-xl p-6">
      <h2 class="text-sm font-bold text-green-700 mb-1">売上</h2>
      <p class="text-2xl font-bold text-green-900">¥482,000</p>
    </div>

    <!-- 注文 -->
    <div class="bg-yellow-100 rounded-xl p-6">
      <h2 class="text-sm font-bold text-yellow-700 mb-1">注文</h2>
      <p class="text-2xl font-bold text-yellow-900">128件</p>
    </div>

    <!-- 新規会員 -->
    <div class="bg-purple-100 rounded-xl p-6">
      <h2 class="text-sm font-bold text-purple-700 mb-1">新規会員</h2>
      <p class="text-2xl font-bold text-purple-900">34名</p>
    </div>

  </div>

</body>
</html>
