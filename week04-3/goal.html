<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week04-3 総復習 ゴールUI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Header: flex justify-between (Week02 復習) -->
  <header class="bg-white shadow px-8 py-4">
    <div class="flex justify-between items-center max-w-5xl mx-auto">
      <h1 class="text-xl font-bold text-indigo-700">🚀 POSSE Dev</h1>
      <nav class="flex gap-6 text-sm text-gray-600">
        <a href="#" class="hover:text-indigo-600 transition">ホーム</a>
        <a href="#" class="hover:text-indigo-600 transition">チーム</a>
        <a href="#" class="hover:text-indigo-600 transition">作品</a>
      </nav>
    </div>
  </header>

  <!-- Main: grid grid-cols-3 (Week04 復習) -->
  <main class="max-w-5xl mx-auto px-8 py-10">

    <!-- Hero: img tag (Week01 復習) -->
    <div class="mb-10 text-center">
      <img src="./images/team.svg" alt="開発チーム" class="mx-auto rounded-xl shadow mb-4" width="400" height="200">
      <h2 class="text-2xl font-bold text-gray-800">みんなで作る、0→1の体験</h2>
      <p class="text-gray-500 mt-2">HTML / CSS / JavaScript / Grid / Flex を組み合わせて、リアルなページを作ろう。</p>
    </div>

    <!-- 3カラムグリッド -->
    <div class="grid grid-cols-3 gap-6">

      <div class="bg-white rounded-xl p-6 shadow hover:shadow-lg transition">
        <div class="text-3xl mb-3">🎨</div>
        <h3 class="font-bold text-gray-800 mb-1">デザイン</h3>
        <p class="text-gray-500 text-sm">Tailwind で素早くUIを構築。クラスで直感的にスタイリング。</p>
      </div>

      <div class="bg-white rounded-xl p-6 shadow hover:shadow-lg transition">
        <div class="text-3xl mb-3">⚙️</div>
        <h3 class="font-bold text-gray-800 mb-1">開発</h3>
        <p class="text-gray-500 text-sm">HTML・CSS・JSの基礎を固めて、フルスタックへ。</p>
      </div>

      <div class="bg-white rounded-xl p-6 shadow hover:shadow-lg transition">
        <div class="text-3xl mb-3">🚀</div>
        <h3 class="font-bold text-gray-800 mb-1">リリース</h3>
        <p class="text-gray-500 text-sm">作ったものをデプロイして、世界に届ける体験を積む。</p>
      </div>

    </div>

  </main>

  <footer class="bg-gray-800 text-gray-400 text-center py-4 text-sm mt-10">
    &copy; 2025 POSSE Dev
  </footer>

</body>
</html>
