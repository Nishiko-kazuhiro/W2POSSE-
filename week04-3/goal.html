<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week04-3 ゴールUI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">

  <header class="bg-white shadow">
    <div class="flex justify-between items-center px-6 py-4 max-w-5xl mx-auto">
      <p class="text-lg font-bold text-slate-800">POSSE Studio</p>
      <nav class="flex gap-4 text-sm text-slate-600">
        <a href="#" class="hover:text-indigo-600">About</a>
        <a href="#" class="hover:text-indigo-600">Works</a>
        <a href="#" class="hover:text-indigo-600">Contact</a>
      </nav>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-8">
    <div class="grid grid-cols-3 gap-4">
      <section class="col-span-2 bg-white rounded-xl shadow p-6 hover:shadow-lg transition">
        <img src="./images/team.svg" alt="学習チームのイラスト" class="w-full h-48 object-cover rounded-lg mb-4">
        <h2 class="text-xl font-bold text-slate-900 mb-2">仲間と作るWebページ</h2>
        <p class="text-slate-600 text-sm leading-relaxed">HTMLの構造、Flexboxの横並び、Gridのカード配置を組み合わせて練習します。</p>
      </section>
      <aside class="space-y-4">
        <div class="bg-white rounded-xl shadow p-6 hover:shadow-lg transition">
          <h3 class="font-bold text-slate-800 mb-1">HTML復習</h3>
          <p class="text-slate-500 text-sm">タグと意味のある構造</p>
        </div>
        <div class="bg-white rounded-xl shadow p-6 hover:shadow-lg transition">
          <h3 class="font-bold text-slate-800 mb-1">Flex復習</h3>
          <p class="text-slate-500 text-sm">ヘッダーの左右配置</p>
        </div>
        <div class="bg-white rounded-xl shadow p-6 hover:shadow-lg transition">
          <h3 class="font-bold text-slate-800 mb-1">Grid練習</h3>
          <p class="text-slate-500 text-sm">2列 + サイドの配置</p>
        </div>
      </aside>
    </div>
  </main>

</body>
</html>
