<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week04-3 Goal</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen">
    <header class="bg-white shadow">
      <div class="flex justify-between items-center px-6 py-4 max-w-5xl mx-auto">
        <h1 class="text-xl font-bold text-slate-900">POSSE Studio</h1>
        <nav class="flex gap-4 text-sm">
          <a href="#" class="text-slate-600 hover:text-blue-600">About</a>
          <a href="#" class="text-slate-600 hover:text-blue-600">Works</a>
          <a href="#" class="text-slate-600 hover:text-blue-600">Contact</a>
        </nav>
      </div>
    </header>
    <main class="max-w-5xl mx-auto px-6 py-8">
      <div class="grid grid-cols-3 gap-4">
        <section class="col-span-2 bg-white rounded-xl shadow p-6 hover:shadow-lg transition">
          <img src="./images/team.svg" alt="学習チームのイラスト" class="w-full h-48 object-cover rounded-lg">
          <h2 class="text-2xl font-bold text-slate-900 mt-5">仲間と作るWebページ</h2>
          <p class="text-slate-600 mt-3 leading-relaxed">HTMLの構造、Flexboxの横並び、Gridのカード配置を組み合わせて練習します。</p>
        </section>
        <aside class="space-y-4">
          <section class="bg-white rounded-xl shadow p-6 hover:shadow-lg transition">
            <p class="text-sm font-bold text-blue-600">HTML復習</p>
            <p class="text-slate-600 text-sm mt-2">見出し・段落・画像を意味で選ぶ。</p>
          </section>
          <section class="bg-white rounded-xl shadow p-6 hover:shadow-lg transition">
            <p class="text-sm font-bold text-green-600">Flex復習</p>
            <p class="text-slate-600 text-sm mt-2">ヘッダーの左右配置を作る。</p>
          </section>
          <section class="bg-white rounded-xl shadow p-6 hover:shadow-lg transition">
            <p class="text-sm font-bold text-purple-600">Grid練習</p>
            <p class="text-slate-600 text-sm mt-2">3列の中で幅を調整する。</p>
          </section>
        </aside>
      </div>
    </main>
  </body>
</html>
