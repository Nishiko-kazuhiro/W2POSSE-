<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Week06-1 ゴールUI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
      border: 1px solid #e2e8f0;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    h1 { font-size: 20px; font-weight: 700; color: #1e293b; }
    .badge {
      background: #d1fae5;
      color: #065f46;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .desc { font-size: 13px; color: #64748b; line-height: 1.65; margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #475569; margin-bottom: 4px; }
    input[type=number] {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 15px;
      color: #1e293b;
      outline: none;
    }
    .btn {
      margin-top: 24px;
      width: 100%;
      background: #059669;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
    }
    .result-box {
      margin-top: 24px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    .result-label { font-size: 11px; font-weight: 700; color: #94a3b8; letter-spacing: .08em; text-transform: uppercase; }
    .result-value { font-size: 28px; font-weight: 800; color: #059669; margin-top: 4px; }
    .result-note { font-size: 11px; color: #94a3b8; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>割り勘チェック</h1>
      <span class="badge">JS Week06</span>
    </div>
    <p class="desc">合計金額と人数を入れて、1人あたり（円・切り上げ）を出します。</p>

    <div class="field">
      <label for="total">合計金額（円）</label>
      <input id="total" type="number" value="4800" placeholder="例：4800">
    </div>
    <div class="field">
      <label for="people">人数</label>
      <input id="people" type="number" value="3" placeholder="例：3">
    </div>

    <button class="btn" type="button">計算する</button>

    <div class="result-box">
      <div class="result-label">1人あたり</div>
      <div class="result-value">1600 円</div>
      <div class="result-note">※端数は切り上げ（Math.ceil）</div>
    </div>
  </div>
</body>
</html>
