<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week06-1 ゴールUI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-6">

  <div class="w-full max-w-md rounded-xl bg-white p-8 shadow-lg ring-1 ring-slate-200">
    <div class="mb-6 flex items-center justify-between">
      <h1 class="text-xl font-bold text-slate-800">割り勘チェック</h1>
      <span class="rounded-full bg-emerald-100 px-3 py-1 text-xs font-semibold text-emerald-800">JS Week06</span>
    </div>
    <p class="mb-6 text-sm leading-relaxed text-slate-600">合計金額と人数を入れて、1人あたり（円・切り上げ）を出します。</p>

    <div class="space-y-4">
      <div>
        <label for="total" class="mb-1 block text-sm font-medium text-slate-700">合計金額（円）</label>
        <input id="total" type="number" min="0" placeholder="例：4800" value="4800"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200">
      </div>
      <div>
        <label for="people" class="mb-1 block text-sm font-medium text-slate-700">人数</label>
        <input id="people" type="number" min="1" placeholder="例：3" value="3"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200">
      </div>
    </div>

    <button type="button" id="calcBtn"
      class="mt-6 w-full rounded-lg bg-emerald-600 py-3 text-center text-sm font-bold text-white shadow hover:bg-emerald-700 active:bg-emerald-800">
      計算する
    </button>

    <div class="mt-6 rounded-lg border border-dashed border-slate-200 bg-slate-50 p-4 text-center">
      <p class="text-xs font-medium uppercase tracking-wide text-slate-500">1人あたり</p>
      <p id="result" class="mt-1 text-2xl font-bold tabular-nums text-emerald-700">1600 円</p>
      <p class="mt-1 text-xs text-slate-500">※端数は切り上げ（Math.ceil）</p>
    </div>
  </div>

  <script>
    const totalInput = document.querySelector("#total");
    const peopleInput = document.querySelector("#people");
    const result = document.querySelector("#result");
    const calcBtn = document.querySelector("#calcBtn");

    function render() {
      const total = Number(totalInput.value);
      const people = Number(peopleInput.value);
      if (!Number.isFinite(total) || !Number.isFinite(people) || total <= 0 || people <= 0) {
        result.textContent = "—";
        return;
      }
      const per = Math.ceil(total / people);
      result.textContent = per + " 円";
    }

    calcBtn.addEventListener("click", render);
    render();
  </script>
</body>
</html>
