<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week05-1 Goal</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen">
    <div class="max-w-5xl mx-auto px-6 py-8">
      <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-8">
        <h1 class="text-2xl font-bold text-blue-900">防災スタート</h1>
        <nav class="flex flex-col md:flex-row gap-2 md:gap-4 text-sm">
          <a href="#" class="text-slate-600 hover:text-blue-700">備える</a>
          <a href="#" class="text-slate-600 hover:text-blue-700">チェックリスト</a>
          <a href="#" class="text-slate-600 hover:text-blue-700">連絡先</a>
        </nav>
      </header>
      <main class="grid grid-cols-1 md:grid-cols-2 gap-6 items-stretch">
        <section class="bg-white rounded-2xl shadow p-6">
          <p class="text-sm font-bold text-orange-500">3 minutes check</p>
          <h2 class="text-3xl font-bold text-slate-900 mt-3">今日からできる防災チェック</h2>
          <p class="text-slate-600 mt-4 leading-relaxed">水・食料・ライト・連絡手段を、家族で確認しておきましょう。</p>
          <a href="#" class="inline-block bg-orange-500 text-white px-5 py-3 rounded-lg font-bold hover:bg-orange-600 transition mt-6">チェックを始める</a>
        </section>
        <section class="bg-blue-900 text-white rounded-2xl shadow p-6">
          <h3 class="text-xl font-bold">最低限の持ち出しリスト</h3>
          <ul class="space-y-3 mt-5">
            <li class="bg-white/10 rounded-lg p-3">飲料水3日分</li>
            <li class="bg-white/10 rounded-lg p-3">モバイルバッテリー</li>
            <li class="bg-white/10 rounded-lg p-3">懐中電灯</li>
            <li class="bg-white/10 rounded-lg p-3">家族の集合場所</li>
          </ul>
        </section>
      </main>
    </div>
  </body>
</html>
