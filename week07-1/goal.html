<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week07-1 ゴールUI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-indigo-950 flex items-center justify-center p-6">

  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-2xl">
    <div class="text-center">
      <p class="text-xs font-semibold uppercase tracking-widest text-indigo-500">在庫つきカウンター</p>
      <h1 class="mt-2 text-2xl font-bold text-slate-900">部室ノート 申請数</h1>
      <p class="mt-1 text-sm text-slate-500">0 未満にならない・在庫上限で止まる</p>
    </div>

    <div class="mt-8 flex items-center justify-center gap-6">
      <button type="button" id="downBtn"
        class="flex h-14 w-14 items-center justify-center rounded-full bg-slate-200 text-2xl font-bold text-slate-700 shadow hover:bg-slate-300 disabled:cursor-not-allowed disabled:opacity-40"
        aria-label="減らす">
        −
      </button>
      <div class="min-w-[6rem] text-center">
        <p id="count" class="text-5xl font-bold tabular-nums text-indigo-700">3</p>
        <p class="mt-2 text-xs text-slate-500"><span id="stockHint">在庫まであと 9 冊</span></p>
      </div>
      <button type="button" id="upBtn"
        class="flex h-14 w-14 items-center justify-center rounded-full bg-indigo-600 text-2xl font-bold text-white shadow hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-indigo-300">
        +
      </button>
    </div>

    <p class="mt-8 text-center text-sm text-slate-600">上限 <span id="maxLabel">12</span> 冊まで</p>
  </div>

  <script>
    const MAX = 12;
    let count = 3;
    const countEl = document.querySelector("#count");
    const hintEl = document.querySelector("#stockHint");
    const downBtn = document.querySelector("#downBtn");
    const upBtn = document.querySelector("#upBtn");
    const maxLabel = document.querySelector("#maxLabel");

    maxLabel.textContent = String(MAX);

    function refresh() {
      countEl.textContent = String(count);
      hintEl.textContent = "在庫まであと " + (MAX - count) + " 冊";
      downBtn.disabled = count <= 0;
      upBtn.disabled = count >= MAX;
    }

    downBtn.addEventListener("click", () => {
      if (count > 0) {
        count -= 1;
        refresh();
      }
    });

    upBtn.addEventListener("click", () => {
      if (count < MAX) {
        count += 1;
        refresh();
      }
    });

    refresh();
  </script>
</body>
</html>
