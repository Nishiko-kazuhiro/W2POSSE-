<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week08-3 メンバーリスト</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 24px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e293b;
    }
    .btn-sort {
      padding: 6px 14px;
      background: #e2e8f0;
      color: #475569;
      border: none;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-sort:hover { background: #cbd5e1; }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .member-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      padding: 18px;
    }
    .member-name {
      font-size: 1rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 4px;
    }
    .member-role {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .member-comment {
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <h1>メンバーリスト</h1>
    <button class="btn-sort" id="sortBtn">名前順</button>
  </header>

  <div class="grid-3" id="memberGrid"></div>

  <script>
    let members = [
      { name: '田中 じゅん', role: 'フロントエンド', comment: 'Reactが好き' },
      { name: '佐藤 はな',   role: 'デザイン',       comment: 'Figmaが得意' },
      { name: '鈴木 けん',   role: 'バックエンド',   comment: 'DBが面白い' },
    ];

    function render() {
      const grid = document.getElementById('memberGrid');
      grid.innerHTML = '';
      members.forEach(function(m) {
        const card = document.createElement('div');
        card.className = 'member-card';
        card.innerHTML =
          '<p class="member-name">' + m.name + '</p>' +
          '<p class="member-role">' + m.role + '</p>' +
          '<p class="member-comment">' + m.comment + '</p>';
        grid.appendChild(card);
      });
    }

    document.getElementById('sortBtn').addEventListener('click', function() {
      members = members.slice().sort(function(a, b) {
        return a.name.localeCompare(b.name, 'ja');
      });
      render();
    });

    render();
  </script>
</body>
</html>
