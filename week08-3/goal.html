<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week08-3 ゴールUI｜名前ソート</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-b from-sky-50 to-white">

  <header class="border-b border-sky-100 bg-white/80 backdrop-blur">
    <div class="mx-auto flex max-w-4xl flex-col gap-4 px-6 py-8 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <p class="text-xs font-bold uppercase tracking-widest text-sky-600">Week08 復習</p>
        <h1 class="mt-1 text-3xl font-bold text-slate-900">プロジェクト班メンバー</h1>
        <p class="mt-2 max-w-xl text-sm text-slate-600">配列をソートして <code class="rounded bg-slate-100 px-1 text-xs">forEach</code> でカード再描画（DOM・Tailwind・イベント）</p>
      </div>
      <button type="button" id="sortBtn"
        class="shrink-0 rounded-xl bg-sky-600 px-5 py-3 text-sm font-bold text-white shadow-lg shadow-sky-600/30 hover:bg-sky-700">
        名前順に並べる
      </button>
    </div>
  </header>

  <main class="mx-auto max-w-4xl px-6 py-10">
    <div id="memberCards" class="grid gap-4 sm:grid-cols-2"></div>
  </main>

  <script>
    let members = [
      { name: "福田", team: "UI" },
      { name: "青木", team: "API" },
      { name: "石井", team: "議事録" },
      { name: "佐藤", team: "進行" },
    ];

    const container = document.querySelector("#memberCards");

    function render() {
      container.innerHTML = "";

      members.forEach((m) => {
        const card = document.createElement("div");
        card.className = "rounded-2xl border border-slate-200 bg-white p-5 shadow-sm";
        card.innerHTML =
          "<p class=\"text-lg font-bold text-slate-900\">" + m.name + "</p>" +
          "<p class=\"mt-1 text-sm text-sky-700\">担当: " + m.team + "</p>";
        container.appendChild(card);
      });
    }

    document.querySelector("#sortBtn").addEventListener("click", () => {
      members = members.slice().sort((a, b) => {
        return a.name.localeCompare(b.name, "ja");
      });
      render();
    });

    render();
  </script>
</body>
</html>
