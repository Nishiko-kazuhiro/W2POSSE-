<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week06-3 ゴールUI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center p-6">

  <div class="flex w-full max-w-2xl flex-col gap-6 rounded-2xl bg-white p-6 shadow-2xl md:flex-row md:items-stretch">
    <div class="flex w-full flex-col overflow-hidden rounded-xl md:w-1/3">
      <div class="flex h-40 w-full flex-col items-center justify-center bg-gradient-to-br from-emerald-500 to-teal-700 md:h-full md:min-h-[220px]">
        <span class="text-6xl" aria-hidden="true">🥤</span>
        <span class="mt-2 text-xs font-medium text-emerald-100">（画像の代わりにプレースホルダ）</span>
      </div>
      <div class="flex items-center justify-center bg-emerald-600 py-3 text-center text-sm font-bold text-white">
        POSSE部室ストア
      </div>
    </div>

    <div class="flex flex-1 flex-col justify-center">
      <p class="text-xs font-semibold uppercase tracking-wider text-emerald-600">復習ミニ課題</p>
      <h1 class="mt-1 text-2xl font-bold text-slate-900">おやつ買い出しメモ</h1>
      <p class="mt-2 text-sm text-slate-600">単価 × 個数の小計を JS で計算（Tailwind + Flex）</p>

      <div class="mt-6 flex flex-wrap items-end gap-4">
        <div class="flex-1 min-w-[120px]">
          <label for="unit" class="mb-1 block text-xs font-medium text-slate-500">単価（円）</label>
          <input id="unit" type="number" min="0" value="120" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900">
        </div>
        <div class="flex-1 min-w-[120px]">
          <label for="qty" class="mb-1 block text-xs font-medium text-slate-500">個数</label>
          <input id="qty" type="number" min="0" value="4" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900">
        </div>
      </div>

      <div class="mt-6 flex items-center justify-between rounded-xl bg-slate-100 px-4 py-3">
        <span class="text-sm font-medium text-slate-600">小計</span>
        <span id="subtotal" class="text-2xl font-bold tabular-nums text-emerald-700">480 円</span>
      </div>

      <button type="button" id="recalc" class="mt-4 w-full rounded-lg border border-slate-200 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">
        再計算
      </button>
    </div>
  </div>

  <script>
    const unitInput = document.querySelector("#unit");
    const qtyInput = document.querySelector("#qty");
    const subtotalEl = document.querySelector("#subtotal");

    function update() {
      const unit = Number(unitInput.value);
      const qty = Number(qtyInput.value);
      if (!Number.isFinite(unit) || !Number.isFinite(qty) || unit < 0 || qty < 0) {
        subtotalEl.textContent = "—";
        return;
      }
      subtotalEl.textContent = unit * qty + " 円";
    }

    document.querySelector("#recalc").addEventListener("click", update);
    unitInput.addEventListener("input", update);
    qtyInput.addEventListener("input", update);
    update();
  </script>
</body>
</html>
