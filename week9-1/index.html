<!DOCTYPE html>
<html lang="ja">

  <head>

    <title>Week9-1: JavaScript基礎文法 - 変数・定数練習</title>

  <body>
    <h1>JavaScript基礎文法 - 変数・定数練習</h1>
    <p>ブラウザの開発者ツールを開いて、コンソールタブを確認してください。</p>
    <p>F12キーを押すか、右クリック→「検証」→「Console」タブを選択してください。</p>
    
    <div style="background-color: #e8f5e8; padding: 20px; margin: 20px 0; border-radius: 5px; border-left: 4px solid #4caf50;">
      <h2>変数とは</h2>
      <p><strong>変数</strong>は、データを保存するための「箱」のようなものです。</p>
      <ul>
        <li><code>let</code>: 値を変更できる変数を作る</li>
        <li><code>const</code>: 値を変更できない定数を作る</li>
        <li><code>var</code>: 古い書き方（現在は推奨されない）</li>
      </ul>
    </div>

    <div style="background-color: #fff3cd; padding: 20px; margin: 20px 0; border-radius: 5px; border-left: 4px solid #ffc107;">
      <h2>練習内容</h2>
      <ul>
        <li>letを使った変数の宣言と代入</li>
        <li>constを使った定数の宣言</li>
        <li>変数の値の変更</li>
        <li>変数を使った計算</li>
        <li>文字列と数値の変数</li>
      </ul>
    </div>

    <script src="./js/script.js"></script>
  </body>

</html>
