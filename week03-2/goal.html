<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week03-2 ゴールUI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-8">
  <div class="max-w-4xl mx-auto flex gap-6 w-full">
    <div class="bg-white rounded-xl shadow p-6 flex-1">
      <h2 class="text-xl font-bold">無料</h2>
      <p class="text-3xl font-bold mt-2">¥0 <span class="text-gray-400 text-sm font-normal">/ 月</span></p>
      <ul class="mt-4 space-y-2 text-sm text-gray-600">
        <li>プロジェクト1件</li>
        <li>ストレージ5GB</li>
        <li>メールサポート</li>
      </ul>
      <button type="button" class="mt-6 w-full border border-gray-300 text-gray-700 py-2 rounded-lg text-sm font-semibold">始める</button>
    </div>
    <div class="bg-white rounded-xl shadow p-6 flex-1 ring-2 ring-blue-500">
      <h2 class="text-xl font-bold">スタンダード</h2>
      <p class="text-3xl font-bold text-blue-600 mt-2">¥1,980 <span class="text-gray-400 text-sm font-normal">/ 月</span></p>
      <ul class="mt-4 space-y-2 text-sm text-gray-600">
        <li>プロジェクト10件</li>
        <li>ストレージ50GB</li>
        <li>チャットサポート</li>
      </ul>
      <button type="button" class="mt-6 w-full bg-blue-600 text-white py-2 rounded-lg text-sm font-semibold">始める</button>
    </div>
    <div class="bg-white rounded-xl shadow p-6 flex-1">
      <h2 class="text-xl font-bold">プロ</h2>
      <p class="text-3xl font-bold mt-2">¥4,980 <span class="text-gray-400 text-sm font-normal">/ 月</span></p>
      <ul class="mt-4 space-y-2 text-sm text-gray-600">
        <li>無制限</li>
        <li>ストレージ500GB</li>
        <li>専任サポート</li>
      </ul>
      <button type="button" class="mt-6 w-full border border-gray-300 text-gray-700 py-2 rounded-lg text-sm font-semibold">始める</button>
    </div>
  </div>
</body>
</html>
