<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week05-3 総復習 ゴールUI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- ヘッダー: レスポンシブ flex -->
  <header class="bg-indigo-700 text-white px-6 py-4">
    <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-3">
      <h1 class="text-xl font-bold">🌐 POSSE Works</h1>
      <nav class="flex flex-wrap justify-center gap-4 text-sm">
        <a href="#" class="hover:text-indigo-200 transition">ホーム</a>
        <a href="#" class="hover:text-indigo-200 transition">作品</a>
        <a href="#" class="hover:text-indigo-200 transition">チーム</a>
        <a href="#" class="hover:text-indigo-200 transition">お問い合わせ</a>
      </nav>
    </div>
  </header>

  <!-- ヒーロー -->
  <section class="bg-indigo-600 text-white py-16 px-6 text-center">
    <h2 class="text-3xl md:text-4xl font-bold mb-4">作ることで、学ぶ。</h2>
    <p class="text-indigo-100 text-lg md:text-xl max-w-xl mx-auto mb-6">
      HTML・CSS・JavaScript を使って、本物のプロダクトを0から作り上げる体験を。
    </p>
    <a href="#works" class="bg-white text-indigo-700 font-bold px-8 py-3 rounded-lg hover:bg-indigo-50 transition">
      作品を見る
    </a>
  </section>

  <!-- 作品グリッド -->
  <main class="max-w-5xl mx-auto px-6 py-12" id="works">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">📦 作品一覧</h2>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <div class="bg-white rounded-xl shadow hover:shadow-lg transition overflow-hidden">
        <div class="bg-blue-100 h-32 flex items-center justify-center text-4xl">🌦️</div>
        <div class="p-4">
          <h3 class="font-bold text-gray-800 mb-1">天気アプリ</h3>
          <p class="text-gray-500 text-sm">APIと連携してリアルタイムの天気を表示。</p>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow hover:shadow-lg transition overflow-hidden">
        <div class="bg-green-100 h-32 flex items-center justify-center text-4xl">✅</div>
        <div class="p-4">
          <h3 class="font-bold text-gray-800 mb-1">ToDoアプリ</h3>
          <p class="text-gray-500 text-sm">JavaScriptでCRUD操作を実装した定番アプリ。</p>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow hover:shadow-lg transition overflow-hidden">
        <div class="bg-purple-100 h-32 flex items-center justify-center text-4xl">🛒</div>
        <div class="p-4">
          <h3 class="font-bold text-gray-800 mb-1">ECサイト</h3>
          <p class="text-gray-500 text-sm">カート機能付きのショッピングページ。</p>
        </div>
      </div>

    </div>
  </main>

  <footer class="bg-gray-800 text-gray-400 text-center py-4 text-sm">
    &copy; 2025 POSSE Works
  </footer>

</body>
</html>
