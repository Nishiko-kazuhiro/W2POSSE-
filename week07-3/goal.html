<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week07-3 マイダッシュボード</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 24px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e293b;
    }
    .badge {
      background: #e0e7ff;
      color: #3730a3;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    .stat-card {
      border-radius: 10px;
      padding: 20px;
      color: #fff;
    }
    .stat-card.blue {
      background: #3b82f6;
    }
    .stat-card.green {
      background: #16a34a;
    }
    .stat-card .label {
      font-size: 0.85rem;
      font-weight: 500;
      opacity: 0.9;
      margin-bottom: 8px;
    }
    .stat-card .value {
      font-size: 2rem;
      font-weight: 700;
    }
    .btn-add {
      display: block;
      width: 100%;
      padding: 12px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .btn-add:hover { background: #4f46e5; }
    .task-list {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      padding: 16px;
      list-style: none;
    }
    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.9rem;
      color: #334155;
    }
    .task-item:last-child { border-bottom: none; }
    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>マイダッシュボード</h1>
    <span class="badge">Week01-07復習</span>
  </header>

  <div class="grid-2">
    <div class="stat-card blue">
      <p class="label">今日のタスク</p>
      <p class="value">3件</p>
    </div>
    <div class="stat-card green">
      <p class="label">完了済み</p>
      <p class="value">5件</p>
    </div>
  </div>

  <button class="btn-add">タスクを追加</button>

  <ul class="task-list">
    <li class="task-item"><input type="checkbox"> コードレビュー</li>
    <li class="task-item"><input type="checkbox"> MTG準備</li>
    <li class="task-item"><input type="checkbox"> ドキュメント作成</li>
  </ul>
</body>
</html>
