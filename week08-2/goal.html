<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week08-2 配列バグ診断</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #fef2f2;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 28px;
      max-width: 520px;
      width: 100%;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 16px;
    }
    pre {
      background: #1e293b;
      color: #f1f5f9;
      border-radius: 8px;
      padding: 16px;
      font-size: 0.8rem;
      line-height: 1.6;
      overflow-x: auto;
      margin-bottom: 20px;
      white-space: pre-wrap;
    }
    .question {
      font-size: 0.95rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 14px;
    }
    .choice {
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      font-size: 0.875rem;
      color: #475569;
      transition: border-color 0.15s, background 0.15s;
    }
    .choice:hover {
      border-color: #fca5a5;
      background: #fff1f2;
    }
    .choice.selected {
      border-color: #ef4444;
      background: #fef2f2;
      color: #991b1b;
    }
    .choice-label {
      font-weight: 700;
      margin-right: 8px;
      color: #64748b;
    }
    .btn {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      background: #dc2626;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { background: #b91c1c; }
  </style>
</head>
<body>
  <div class="card">
    <h1>配列バグを見つけよう</h1>
    <pre>const scores = [85, 92, 78, 96, 88];
const doubled = scores.forEach(function(s) {
  return s * 2;  // ← バグ
});
console.log(doubled); // undefined</pre>

    <p class="question">doubledがundefinedになる理由を選んでください</p>

    <div class="choice" id="choiceA" onclick="select('A')">
      <span class="choice-label">A</span>forEachは戻り値がない。mapを使うべき
    </div>
    <div class="choice" id="choiceB" onclick="select('B')">
      <span class="choice-label">B</span>return文の書き方が間違っている
    </div>

    <button class="btn" onclick="check()">答え合わせ</button>
  </div>

  <script>
    let selected = null;
    function select(v) {
      selected = v;
      document.getElementById('choiceA').classList.toggle('selected', v === 'A');
      document.getElementById('choiceB').classList.toggle('selected', v === 'B');
    }
    function check() {
      if (!selected) { alert('選択してください'); return; }
      if (selected === 'A') {
        alert('正解！ forEach は配列の各要素に処理を行うだけで、戻り値は常に undefined です。新しい配列を作るには map() を使いましょう。');
      } else {
        alert('不正解。return文の書き方は正しいですが、forEach 自体が戻り値を返さない仕組みなので doubled は undefined になります。');
      }
    }
  </script>
</body>
</html>
